[device]
codename = "diting"
brand = "Redmi"
model = "Redmi K50 Ultra"
ab = true
soc = { hans = "第一代骁龙®8+移动平台", hant = "Snapdragon® 8+ Gen 1 行動平台", en = "Snapdragon® 8+ Gen 1 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, which the Chinese system runs the phone at: its
# persist.sys.miui_resolution holds nothing, so nothing is scaled.
width = 1220
height = 2712
density = 480
diagonal = 6.67

[modules]
# The phone carries no system_dlkm: its modules are in the vendor_boot
# ramdisk, in vendor_dlkm and in vendor. The vendor folder comes first
# because goodix_core is in the ramdisk as well, listed there with fewer
# dependencies, and the copy in the vendor folder is the one the system
# loads, whose dependencies bring xiaomi_touch and msm_drm.
sources = ["vendor", "vendor_boot", "vendor_dlkm"]
# The touchscreen: Goodix GTX8 behind Xiaomi's touch layer. The phone also
# carries FocalTech's driver, which binds no device here. Both are named,
# under the two names the driver has been given across the phone's builds,
# because a build carries only the one its own panels were fitted with and
# a name it does not carry is skipped rather than stopping the boot.
# The binder driver comes first: on the kernels whose build keeps it out of
# the kernel itself, nothing that registers a service opens a device that
# is not there, and the phone's own recovery loads it for that reason.
# The Goodix driver is left to the service below, which puts the files it
# reads through the firmware loader where the loader looks first: those
# files are on the vendor partition, under a folder the phone's own table
# mounts the modem image over.
load = ["binder_gki", "fts_touch_spi", "focaltech_fts", "qcom-hv-haptics"]

# What turns the controller's raw frames into touches is Xiaomi's touch
# feature service, and a recovery runs none of it: the driver reports
# positions itself, which this leaves on as the phone's system has it.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The WLAN firmware is on the modem partition, which the phone mounts at
# /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# persist, which the phone mounts at /mnt/vendor/persist and its own
# recovery leaves unmounted: the WLAN's MAC address is there, and so is
# what the key service needs for a key that cannot be rolled back.
[partitions]
mounted = ["persist"]

# The kernel loads goodix_core from the vendor_boot ramdisk before the
# modem partition is mounted over /vendor/firmware, so the files the
# driver asks for are not there yet and it gives up. They are on the
# vendor partition, under the folder the modem image covers: the driver
# is given them through the first folder the firmware loader looks in,
# which the vendor image's own copy of them is not under.
# The modem image is left as it is. It carries the WLAN's firmware, and
# a driver that asks for a file it cannot find takes the phone down.
# A build that carries the driver elsewhere, or has none, is left as it
# is: nothing is put in the loader's folder for it.
[[service]]
path = "/vendor/bin/sh"
args = ["-c", '''
slot=$(getprop ro.boot.slot_suffix)
mkdir -p /mnt/skyward-vendor /etc/firmware
if mount -o ro /dev/block/mapper/vendor$slot /mnt/skyward-vendor 2>/dev/null; then
    for name in goodix_cfg_group_l12.bin goodix_firmware_l12.bin goodix_cfg_group_l12_new.bin goodix_firmware_l12_new.bin; do
        if [ -f "/mnt/skyward-vendor/firmware/$name" ]; then
            cp "/mnt/skyward-vendor/firmware/$name" "/etc/firmware/$name"
        fi
    done
    umount -l /mnt/skyward-vendor 2>/dev/null
fi
for module in /vendor/lib/modules/goodix_core.ko /vendor_dlkm/lib/modules/goodix_core.ko /lib/modules/goodix_core.ko; do
    if [ -f "$module" ]; then
        rmmod goodix_core 2>/dev/null
        insmod "$module"
        break
    fi
done
umount -l /mnt/skyward-vendor 2>/dev/null
true
''']
oneshot = true
user = "root"
groups = ["root", "system"]

# What the phone's own init runs once the system has finished starting.
# The kernel starts both CPU clusters on the performance governor, which
# holds them at their highest clock, and Qualcomm's idle driver keeps
# idle CPUs from powering down until the script tells it otherwise;
# without it the phone heats up while the recovery sits idle.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: Qualcomm's QCA6490 on the cnss2 platform driver, its firmware on
# the modem partition. The driver reads its settings and the MAC address
# through the firmware loader, so both are handed over under the names it
# asks for; the MAC is read from persist, which is mounted above, rather
# than by mounting that partition a second time. Once fs_ready is
# written, cnss2 powers the chip up and wlan0 appears.
#
# The supplicant is the vendor partition's own, built from Android 12: it
# registers with the hardware service directory of that version and runs
# on its libraries, which the recovery carries under /skyward/hidl/a<sdk>.
# The version is filled in from the stock image as the image is packed.
# The system's own copies come after, if at all.
[wlan]
modules = ["qca_cld3_qca6490"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
release = [{ path = "/sys/kernel/cnss/fs_ready", value = "0" }]
firmware = [
    { name = "wlan/qca_cld/qca6490/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6490/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/qca6490/wlan_mac.bin", path = "/mnt/vendor/persist/qca6490/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/skyward/hidl/a{sdk}/lib", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"
# The chip's own coming up takes the better part of ten seconds once its
# driver is in, which its user would wait at the switch: it is brought up
# as the recovery starts instead.
prewarm = true
# Told the chip as the supplicant starts. Where none is told it keeps the
# world-safe channels, which hold none of the higher 5 GHz ones a router
# here sits on, so a network on one of those is never reached.
country = "CN"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.2.0, whose system is Android 15 while its vendor stays Android 12,
# and whose full package on the phone maker's server holds the recovery
# partition the recovery is built on top of.
[stock]
version = "OS3.0.2.0.VLFCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.2.0.VLFCNXM/diting-ota_full-OS3.0.2.0.VLFCNXM-user-15.0-315cddb555.zip"
recovery = "c4c720dd058a7526570bc956222577dd323409781a318a5021f99aec0a740fe8"

# qcom-hv-haptics. The phone measures the motor as it boots, 169.8 Hz
# here, and the driver plays samples at that frequency. The system's own
# clicks feel as one at a quarter of this, and past three quarters the
# motor rattles. The driver takes no effect lighter than half its drive:
# its converter does not run below that, and a lighter one is turned down
# rather than played weakly, so this is where the slider's low end is.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. And what of the
# data partition a backup leaves out because the secure world keeps it in
# step with itself: its own storage, its apps' data, that of Xiaomi's own
# trusted environment, the secure element's state and the fingerprint
# templates.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

# Where the phone's own programs keep logs in the data partition: the
# system's, the minidumps, what Xiaomi's log manager keeps of each part of
# the phone, and what the modem and Wi-Fi leave when they crash.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
