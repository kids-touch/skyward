[device]
codename = "manet"
brand = "Redmi"
model = "REDMI K70 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode: persist.sys.miui_default_resolution in the running
# system says 1440 by 3200, and ro.sf.lcd_density says 560. The system starts
# in the lower mode the phone ships with, 1080 by 2400 at 420
# (persist.sys.miui_resolution), as the K80's does; a recovery runs the
# panel's own mode, as on the K80.
width = 1440
height = 3200
density = 560
diagonal = 6.67

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Goodix's, behind Xiaomi's touch layer, the touch drivers
# the phone's own modules.load lists (xiaomi_touch, then goodix_core, which
# the layer is used by; goodix_fod beside them for the reader under the
# screen, which a recovery has no use for).
load = ["xiaomi_touch", "goodix_core"]

# As on the K80, no init script of the phone's starts touch_report: the touch
# feature service turns the controller's raw frames into touches with
# /odm/lib64/libtouchreport.so, and a recovery runs none of it. Told through
# Xiaomi's touch layer at /sys/class/touch/touch_dev, the driver has the
# controller report positions itself.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The persist partition is not mounted here: the recovery mounts it
# read-only itself while it reads the WLAN's MAC address from it, and a
# partition mounted twice, once as ext4 and once as the loader's read-only
# mount, fails with "device or resource busy".

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc, for the
# pineapple platform this phone and the K80 share: the kernel starts the CPU
# clusters on the performance governor, which holds them at their highest
# clock; the script hands them to WALT, lets idle CPUs power down and sets how
# the memory bus scales.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: the kiwi_v2 node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.load lists for the chip it has
# (cnss2 and icnss2 under it). Its cfg80211 asks for rfkill, one of the
# kernel's own modules in system_dlkm, as the K80's does. Its recovery covers
# the vendor partition's firmware folder with the modem's, as the K80's does,
# so the settings and the MAC address are given to the loader again: the
# settings from the vendor partition, the address from the phone's own file
# in persist (kiwi_v2/wlan_mac.bin there). wpa_supplicant runs on the
# recovery's own libraries before the vendor partition's.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
release = [{ path = "/sys/kernel/cnss/fs_ready", value = "0" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"
# The WLAN comes up with the pages, so that the date and time it sets are
# already right on the first screen, and the networks the phone saved are
# joined without the page being opened.
on_boot = true

# The phone's keymint service does not come up in this recovery (its own
# libraries want a newer libc++ than the recovery carries), so the pages do
# not wait the whole twenty seconds for it: they come up after six.
[boot]
ready = 6
# The data partition of this phone is not encrypted, so it is mounted as the
# pages come up: its files and the networks the phone saved are there at once,
# with nothing to be opened or typed first.
open_data = true

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS3.0.307.0.WNMCNXM.
[stock]
version = "OS3.0.307.0.WNMCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WNMCNXM/manet-ota_full-OS3.0.307.0.WNMCNXM-user-16.0-01c57af24f.zip"
recovery = "f436c69ac47cd99a08b2cd88be94296408c1b5db98ed8093fe2181929a7da5b1"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency in /sys/class/qcom-haptics/lra_frequency_hz as
# the K80's does; the click is made from samples at that frequency, and the
# strengths are the K80's.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. And what of the data
# partition a backup leaves out because the secure world keeps it in step
# with itself: its own storage, its apps' data, that of Xiaomi's own trusted
# environment, the secure element's state and the fingerprint templates.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

# Where the phone's own programs keep logs in the data partition: the
# system's, the minidumps, what Xiaomi's log manager keeps of each part of
# the phone, and what the modem, Wi-Fi and Bluetooth leave when they crash.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
