# Experimental port. Display, touch and WLAN have passed device tests;
# decryption is being verified separately.
# See docs/piano.md for evidence and the required validation sequence.
[device]
codename = "piano"
brand = "Xiaomi"
model = "Xiaomi Pad 8 Pro"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# Stock DTBO p81 dual-DSI panels: two 1600-pixel links, 2136 lines.
# Density follows the piano device tree; runtime KMS selects the mode.
width = 3200
height = 2136
density = 440
diagonal = 11.2
# The p81 video-mode LCD rejects the current KMS resume commit after CRTC
# shutdown. Blank through its backlight until that path is implemented.
backlight_only = true

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
load = ["nt36532_touch"]

[touch]
# The stock properties specify ORIENTATION_270; the input grid is portrait.
# Device testing confirms accurate taps and scrolling with this direction.
rotation = 270

[partitions]
# Stock WLAN firmware links point to /mnt/vendor/persist/wlan/wlan_mac.bin.
mounted = ["persist"]

# The connected stock device's init.qti.kernel.rc starts this exact service
# at boot completion, with these accounts. It hands CPU scaling to WALT.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[wlan]
# Stock-derived piano modules.load and vendor firmware configuration.
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
release = [{ path = "/sys/kernel/cnss/fs_ready", value = "0" }]
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wlan_mac.bin", path = "/mnt/vendor/persist/wlan/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

[stock]
version = "OS4.0.6.0.XPYCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.6.0.XPYCNXM/piano-ota_full-OS4.0.6.0.XPYCNXM-user-17.0-96dbee09b8.zip"
recovery = "19e676d7c1914688f3289df49b2e3a9e705901a300f595733634189e8508ca8f"

[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/proc/tp_fw_version",
    "/proc/tp_lockdown_info",
    "/proc/tp_selftest",
    "/sys/class/touch/touch_dev/abnormal_event",
    "/sys/class/touch/touch_dev/enable_touch_raw",
    "/sys/class/touch/touch_dev/palm_sensor",
    "/sys/class/touch/touch_dev/resolution_factor",
    "/sys/class/touch/touch_dev/touch_doze_analysis",
    "/sys/class/touch/touch_dev/touch_finger_status",
    "/sys/class/touch/touch_dev/touch_ic_buffer",
    "/sys/class/touch/touch_dev/touch_thp_ic_cmd",
    "/sys/class/touch/touch_dev/touch_thp_ic_cmd_data",
]

[[owners]]
user = "system"
group = "system"
mode = 0o666
paths = [
    "/dev/xiaomi-touch",
]

# The Novatek panel uses the stock host touch algorithm. Controller-only
# reporting was tested and produced no events; keep stock raw processing.
[[service]]
path = "/odm/bin/hw/vendor.xiaomi.hw.touchfeature-service"
libraries = ["/odm/lib64", "/system/lib64", "/vendor/lib64"]
ready_service = "vendor.xiaomi.hw.touchfeature.ITouchFeature/default"
user = "system"
groups = ["system", "input"]
capabilities = ["SYS_NICE"]

# Names, users and groups from this device's stock vendor init definitions.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64/hw", "/vendor/lib64", "/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
# This platform declares Gatekeeper in its platform manifest, outside the
# fragment directory. Skyward publishes the stock declaration explicitly.
description = "/vendor/etc/vintf/manifest_sun.xml"
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]
sockets = [{ name = "hlos_mink_opener", user = "system", group = "system", mode = 0o660 }]

# QTEE's app loader is separate from its generic MINK opener. Weaver's
# UUID names a TA in the stock modem firmware, loaded through this daemon.
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]
sockets = [
    { name = "ssgtzd", user = "system", group = "oem_2912", mode = 0o660 },
    { name = "ssgtzd_opener", user = "system", group = "system", mode = 0o660 },
]

[[service]]
path = "/odm/bin/hw/android.hardware.weaver"
libraries = ["/system/lib64", "/odm/lib64", "/vendor/lib64", "/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64"]
ready_service = "android.hardware.weaver.IWeaver/default"
registers = [
    "vendor.xiaomi.hardware.miauthsecretd.ICpaceService/default",
    "vendor.xiaomi.hardware.oldcredential.IOldCredentialService/default",
]
user = "system"
groups = ["system", "drmrpc"]

